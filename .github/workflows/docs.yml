name: docs
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'messages/**'
      - 'src/commands/**'
      - 'tools/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# One deployment at a time; a newer push replaces a pending one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # The command pages are generated from the plugin's --help (oclif.manifest.json).
      - run: bun install --frozen-lockfile
      - run: npm run docs:commands
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
